name: Sync to GitHub

# Triggered when Replit pushes commits to the connected GitHub repository.
# This workflow then mirrors those commits to the destination repo defined
# by GITHUB_USERNAME/GITHUB_REPO_NAME (configured as GitHub repo secrets).
#
# Required GitHub repo secrets:
#   GITHUB_TOKEN    — Personal access token with repo write access
#   GITHUB_USERNAME — GitHub username that owns the destination repo
#   GITHUB_REPO_NAME — Destination repository name to keep in sync

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to destination GitHub repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
          GITHUB_REPO_NAME: ${{ secrets.GITHUB_REPO_NAME }}
        run: |
          if [ -z "$GITHUB_USERNAME" ] || [ -z "$GITHUB_REPO_NAME" ]; then
            echo "ERROR: GITHUB_USERNAME and GITHUB_REPO_NAME secrets must be set."
            exit 1
          fi
          git remote add destination https://${GITHUB_USERNAME}:${GITHUB_TOKEN}@github.com/${GITHUB_USERNAME}/${GITHUB_REPO_NAME}.git
          git push destination main
