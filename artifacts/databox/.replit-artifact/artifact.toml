kind = "web"
previewPath = "/"
title = "Databox"
version = "1.0.0"
id = "artifacts/databox"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22733

[services.development]
run = "pnpm --filter @workspace/databox run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/databox", "run", "build" ]
publicDir = "artifacts/databox/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22733"
BASE_PATH = "/"
