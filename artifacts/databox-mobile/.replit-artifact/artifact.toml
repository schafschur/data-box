kind = "mobile"
previewPath = "/mobile/"
title = "Databox Mobile"
version = "1.0.0"
id = "artifacts/databox-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 19174

[services.development]
run = "pnpm --filter @workspace/databox-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/databox-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/databox-mobile", "run", "serve" ]

[services.env]
PORT = "19174"
BASE_PATH = "/mobile/"
